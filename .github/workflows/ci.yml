# Type-check, test and build on every pull request and on main (ADR-0020 decision 4).
# release.yml does not wait for this workflow: its publish job runs the same checks on the tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check, test, build on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Dropping a version is a major release (maintainer-guide/release/versioning).
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Tests
        run: bun run test

      # A pull request from a fork has no token, so it skips the upload instead of failing.
      - name: Upload coverage to Codecov
        if: >-
          matrix.node-version == 24 &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true

      - name: Build
        run: bun run build

  test-package:
    name: Install the packed package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: quality

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack
        run: npm pack

      - name: Install the tarball into an empty project
        run: |
          mkdir test-install
          cd test-install
          npm init -y
          npm install ../nepali-number-*.tgz

      - name: Load it with require
        working-directory: test-install
        run: |
          node -e "
            const { toNepali, toEnglish, formatNepaliNumber } = require('nepali-number');
            console.log('toNepali(123):', toNepali(123));
            console.log('toEnglish(\"१२३\"):', toEnglish('१२३'));
            console.log('formatNepaliNumber(1234567):', formatNepaliNumber(1234567));
            if (toNepali(123) !== '१२३' || toEnglish('१२३') !== '123') process.exit(1);
          "

      - name: Load it with import
        working-directory: test-install
        run: |
          node --input-type=module -e "
            import { toNepali, toEnglish } from 'nepali-number';
            console.log('toNepali(123):', toNepali(123));
            if (toNepali(123) !== '१२३' || toEnglish('१२३') !== '123') process.exit(1);
          "
