# release-please proposes each version in a pull request; merging it publishes (ADR-0020).
# The publish job stays in this file: npm's trusted publisher is registered for release.yml,
# and what release-please creates with GITHUB_TOKEN starts no other workflow.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  # A release that has started always finishes.
  cancel-in-progress: false

jobs:
  release-please:
    name: Propose or create the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Push the tag and create the GitHub release.
      contents: write
      # Open and update the release pull request, and label it.
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # npm accepts the publish only from this workflow inside this environment.
    environment: npm
    permissions:
      contents: read
      # Trusted publishing: GitHub proves the run's identity to npm, so no token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Check the npm version
        run: |
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("npm is older than 11.5.1"); process.exit(1); }
          ' "$(npm --version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: List what will be published
        run: npm pack --dry-run

      # Provenance is attached by default: a public package from a public repository.
      - name: Publish
        run: npm publish --access public
